<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>C# Atlas</title>
  <meta name="description" content="C# Atlas is a searchable C# reference for errors, exceptions, code examples, and concepts.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="C# Atlas">
  <meta property="og:description" content="Search C# errors, exceptions, code examples, and concepts.">
  <meta property="og:url" content="https://csharpatlas.pages.dev/">
  <meta property="og:image" content="https://csharpatlas.pages.dev/csharp-atlas-og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="C# Atlas — Search C# errors, exceptions, code examples, and concepts.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="C# Atlas">
  <meta name="twitter:description" content="Search C# errors, exceptions, code examples, and concepts.">
  <meta name="twitter:image" content="https://csharpatlas.pages.dev/csharp-atlas-og.png">
  <link rel="stylesheet" href="/src/styles.css">
  <link rel="stylesheet" href="/src/code-enhancements.css">
  <link rel="stylesheet" href="/src/list-discovery.css">
  <link rel="stylesheet" href="/src/quest-view.css">
</head>
<body>
<header>
  <div class="nav">
    <button class="logo" id="homeButton">C<span>#</span> Atlas</button>
    <nav>
      <button data-nav-type="all">すべて</button>
      <button data-nav-type="code">コード集</button>
      <button data-nav-type="exception">例外</button>
      <button data-nav-type="compiler-error">コンパイルエラー</button>
      <button data-nav-type="compiler-warning">コンパイル警告</button>
    </nav>
    <label class="language-picker" for="languageSelect">
      <span id="languageLabel" class="sr-only">言語</span>
      <select id="languageSelect" aria-labelledby="languageLabel">
        <option value="ja">日本語</option>
        <option value="en">English</option>
      </select>
    </label>
  </div>
</header>

<main>
  <section id="homeView">
    <div class="hero">
      <div id="heroEyebrow" class="eyebrow">逆引き C# リファレンス</div>
      <h1><span id="heroTitle1">やりたいことも、</span><br><span id="heroTitle2">壊れた理由も。</span></h1>
      <p id="heroDescription">C# のコード例、例外、コンパイルエラー・警告、仕組みをひとつの検索で。</p>
      <form id="searchForm" class="search">
        <input id="searchInput" placeholder="例: JSON 読み込み / NullReferenceException / CS0103" autocomplete="off">
        <button id="searchButton" type="submit">検索</button>
      </form>
      <div class="quick">
        <button data-query="JSON">JSON</button>
        <button data-query="Dictionary">Dictionary</button>
        <button data-query="null">null</button>
        <button data-query="CS0103">CS0103</button>
      </div>
    </div>

    <div class="layout">
      <aside>
        <div id="asideTitle" class="aside-title">種類</div>
        <button class="type active" data-type="all">すべて</button>
        <button class="type" data-type="code">コード集</button>
        <button class="type" data-type="exception">例外</button>
        <button class="type" data-type="compiler-error">コンパイルエラー</button>
        <button class="type" data-type="compiler-warning">コンパイル警告</button>
        <button class="type" data-type="logic">論理エラー</button>
        <button class="type" data-type="concept">仕組み</button>
      </aside>

      <section>
        <div class="view-switch" role="group" aria-label="View mode">
          <button id="listViewButton" type="button" class="active" aria-pressed="true">一覧で見る</button>
          <button id="questViewButton" type="button" aria-pressed="false">学習マップで見る</button>
        </div>

        <div id="listViewPanel">
          <div class="list-head">
            <h2 id="listTitle">おすすめ</h2>
            <span id="resultCount"></span>
          </div>
          <div class="list-tools">
            <div class="topic-filter-group">
              <span id="topicFilterLabel" class="list-tool-label">トピック</span>
              <div id="topicFilters" class="topic-filters"></div>
            </div>
            <div class="list-tool-actions">
              <label class="sort-picker" for="sortSelect">
                <span id="sortLabel">並び順</span>
                <select id="sortSelect">
                  <option value="recommended">おすすめ順</option>
                  <option value="title">名前順</option>
                  <option value="recent">最近見た順</option>
                  <option value="favorites">お気に入り優先</option>
                </select>
              </label>
              <button id="favoritesOnlyButton" type="button" aria-pressed="false">☆ お気に入り</button>
              <button id="recentOnlyButton" type="button" aria-pressed="false">最近見た</button>
            </div>
          </div>
          <div id="selectedFilters" class="selected-filters" hidden>
            <span id="selectedFiltersLabel" class="list-tool-label">選択中</span>
            <div id="selectedFilterChips" class="selected-filter-chips"></div>
            <button id="clearFiltersButton" type="button">すべて解除</button>
          </div>
          <div id="cards" class="cards"></div>
          <div id="empty" class="empty">一致する項目がありません。</div>
        </div>

        <div id="questViewPanel" class="quest-view-panel hidden">
          <div class="quest-toolbar">
            <div class="quest-toolbar-copy">
              <h2 id="questChapterTitle"></h2>
              <p id="questChapterDescription"></p>
            </div>
            <div class="quest-toolbar-side">
              <button id="questFitButton" type="button">全体を表示</button>
              <span id="questStats" class="quest-stats"></span>
            </div>
          </div>
          <div class="quest-layout">
            <div id="questViewport" class="quest-viewport">
              <div id="questWorld" class="quest-world">
                <svg id="questEdges" class="quest-edges" aria-hidden="true"></svg>
                <div id="questNodes" class="quest-nodes"></div>
              </div>
              <div id="questHelp" class="quest-help">ドラッグ: 移動 / ホイール: ズーム / クリック: 概要 / ダブルクリック: 記事を開く</div>
            </div>
            <aside id="questDetail" class="quest-detail"></aside>
          </div>
        </div>
      </section>
    </div>
  </section>

  <section id="detailView" class="detail hidden">
    <button id="backButton" class="back">← 一覧に戻る</button>
    <div id="detailContent"></div>
  </section>
</main>

<script type="module" src="/src/main.js"></script>
<script type="module" src="/src/quest-bootstrap.js"></script>
</body>
</html>
